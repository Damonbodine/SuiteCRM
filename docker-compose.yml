version: '3.8'

services:
  db:
    image: mysql:5.7
    platform: linux/amd64
    container_name: suitecrm-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: suitecrm
      MYSQL_USER: suiteuser
      MYSQL_PASSWORD: suitepass
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.1
    container_name: suitecrm-elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"

  adminer:
    image: adminer:latest
    container_name: suitecrm-adminer
    restart: always
    ports:
      - "8081:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=db

  redis:
    image: redis:7-alpine
    container_name: suitecrm-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mailhog:
    image: mailhog/mailhog:latest
    container_name: suitecrm-mailhog
    restart: always
    ports:
      - "1025:1025"  # SMTP server
      - "8025:8025"  # Web UI

  web:
    build: .
    container_name: suitecrm-app
    depends_on:
      - db
      - elasticsearch
      - redis
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
      - DB_HOST=db
      - DB_NAME=suitecrm
      - DB_USER=suiteuser
      - DB_PASS=suitepass
      - ELASTICSEARCH_HOST=elasticsearch:9200
      - REDIS_HOST=redis
    working_dir: /var/www/html
    command: sh -c "find /var/www/html -type f -not -path '*/.git/*' -exec chown www-data:www-data {} + && find /var/www/html -type d -not -path '*/.git/*' -exec chown www-data:www-data {} + && apache2-foreground"

volumes:
  db_data:
  es_data:
  redis_data: